app:
  name: speak-swiftly-server
  environment: development
  host: 127.0.0.1
  port: 7337
  sseHeartbeatSeconds: 10
  completedJobTTLSeconds: 900
  completedJobMaxCount: 200
  jobPruneIntervalSeconds: 60
  runtime:
    speechBackend: qwen3_smol
    duckMediaVolume: off
    defaultVoiceProfileName:
  http:
    enabled: true
    host: 127.0.0.1
    port: 7337
    sseHeartbeatSeconds: 10
  mcp:
    enabled: true
    path: /mcp
    serverName: speak-swiftly-mcp
    title: SpeakSwiftly
  networkAudioReceiver:
    enabled: false
    serviceName: SpeakSwiftly Audio Receiver
    port: 0
    sharedToken:
  remoteGeneration:
    allowRemoteStreamRequests: false
    sharedToken:
